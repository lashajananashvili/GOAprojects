<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOA website</title>
  <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  }

  body {
    background-color: #000;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
  }

  .feedback-container {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .feedback-title {
    text-align: center;
    font-size: 1.5rem;
    font-weight: bold;
  }

  .emoji-container {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.5rem 0;
  }

  .emoji-button {
    width: 3.5rem;
    height: 3.5rem;
    border-radius: 0.5rem;
    background-color: #374151;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Bouncy transition */
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .emoji-button:hover {
    background-color: #4B5563;
    transform: translateY(-10px) scale(1.2); /* Move up and scale */
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
    z-index: 10; /* Bring to front */
  }

  .emoji-button.selected {
    border: 2px solid #3B82F6;
  }

  .feedback-textarea {
    width: 100%;
    height: 8rem;
    background-color: rgba(55, 65, 81, 0.5);
    border: none;
    border-radius: 0.5rem;
    padding: 1rem;
    color: #fff;
    resize: none;
    font-size: 1rem;
  }

  .feedback-textarea::placeholder {
    color: #9CA3AF;
  }

  .feedback-textarea:focus {
    outline: 2px solid #3B82F6;
  }

  .submit-button {
    width: 100%;
    padding: 0.75rem;
    background-color: #3B82F6;
    color: white;
    border: none;
    border-radius: 0.5rem;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .submit-button:hover {
    background-color: #2563EB;
  }
  </style>
</head>
<body>
  <div class="feedback-container">
    <h2 class="feedback-title">How did we do? 😊</h2>
    
    <form id="feedback-form">
      <div class="emoji-container">
        <button type="button" class="emoji-button" data-emoji="angry">😠</button>
        <button type="button" class="emoji-button" data-emoji="confused">😕</button>
        <button type="button" class="emoji-button" data-emoji="neutral">😐</button>
        <button type="button" class="emoji-button" data-emoji="happy">😊</button>
        <button type="button" class="emoji-button" data-emoji="love">😍</button>
      </div>
      
      <div style="margin-top: 1.5rem;">
        <textarea 
          id="feedback-text" 
          class="feedback-textarea" 
          placeholder="Share your thoughts..."></textarea>
      </div>
      
      <div style="margin-top: 1.5rem;">
        <button type="submit" class="submit-button">Submit Feedback</button>
      </div>
    </form>
  </div>
  <script src="s"></script>
</body>
</html>
